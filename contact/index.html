---
layout: page
title: "Contact"
description: "Get in touch with Greg Warden about streetdog.life — the stories, the game, or anything else."
---
<p>
    Anything at all — the stories, the game, or something else entirely.
  </p>

  <form id="contact-form" class="formcard" novalidate>
    <!-- HONEYPOT. Not display:none — the better bots skip hidden fields, but they do not compute
         layout, so an off-screen input still looks like a normal one to them. The name is
         deliberately NON-SEMANTIC so no password manager will ever autofill it; see _lib.js. -->
    <div class="hp" aria-hidden="true">
      <label for="c-hp">Leave this field empty</label>
      <input id="c-hp" name="hp_field" type="text" tabindex="-1" autocomplete="off">
    </div>

    <div class="field">
      <label for="c-name">Name</label>
      <input id="c-name" name="name" type="text" autocomplete="name" required maxlength="120">
    </div>

    <div class="field">
      <label for="c-email">Email</label>
      <input id="c-email" name="email" type="email" autocomplete="email" required maxlength="200">
    </div>

    <div class="field">
      <label for="c-message">What’s on your mind?</label>
      <textarea id="c-message" name="message" rows="6" required maxlength="4000"></textarea>
    </div>

    <!-- Turnstile renders here. The site key is public by design; the secret is a Pages environment
         variable and never appears in this repo. ⚠ Until a real key replaces the placeholder the
         widget renders Cloudflare's own error UI, complete with a "Troubleshoot" link. -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEmnkgXCIVCu_CW2" data-theme="auto"></div>

    <button type="submit">Send</button>
  </form>

  <p id="form-status" role="status" aria-live="polite"></p>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script>
(function () {
  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');
  var loadedAt = Date.now();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    status.className = '';
    status.textContent = '';

    // Validate here as well as in the Function. The client check is for a fast, kind error message;
    // the server check is the one that counts, because anything here can be bypassed.
    var data = Object.fromEntries(new FormData(form).entries());
    // How long the form was open. Bots post the instant they parse the page. Forgeable, which is why
    // it only ever rejects and is stacked behind Turnstile rather than trusted alone.
    data.elapsed_ms = String(Date.now() - loadedAt);

    if (!data.name || !data.email || !data.message) {
      status.className = 'err';
      status.textContent = 'Please fill in all three fields.';
      return;
    }

    var button = form.querySelector('button');
    button.disabled = true;
    button.textContent = 'Sending…';

    try {
      var res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      var out = await res.json().catch(function () { return {}; });

      if (res.ok) {
        form.style.display = 'none';
        status.className = 'ok';
        status.textContent = "Thank You. I'll be in touch soon.";
      } else {
        status.className = 'err';
        status.textContent = out.error || 'Something went wrong. Please try again in a moment.';
        button.disabled = false;
        button.textContent = 'Send';
        if (window.turnstile) window.turnstile.reset();
      }
    } catch (err) {
      // A network failure must not look like a submission that worked.
      status.className = 'err';
      status.textContent = 'Could not reach the server. Please try again in a moment.';
      button.disabled = false;
      button.textContent = 'Send';
      if (window.turnstile) window.turnstile.reset();
    }
  });
})();
</script>
